name: Validate Repository

on:
  pull_request:
  push:
    branches: [main, master, refactor/**]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml jinja2
      - run: python scripts/validate_repo.py
      - run: python scripts/run_evals.py
      - run: python scripts/check_rule_conflicts.py
      - run: python scripts/build_rule_index.py
      - run: python scripts/build_readme.py
      - run: python -m py_compile scripts/*.py
