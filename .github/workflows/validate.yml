name: Validate Repository

on:
  pull_request:
  push:
    branches: [main, master, refactor/**]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml
      - run: python scripts/validate_repo.py
